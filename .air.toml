root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/app ./cmd"
  entrypoint = "./tmp/app"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "bin", "frontend", "node_modules", "docker"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "12s"

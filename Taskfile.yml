version: '3'

vars:
  DEV_DATABASE_URL: 'postgres://{{.DATABASE_USERNAME | default "bookmanager"}}:{{.DATABASE_PASSWORD | default "bookmanager"}}@localhost:{{.DATABASE_PORT_OUTER | default "5432"}}/{{.DATABASE_NAME | default "bookmanager"}}?sslmode=disable'
  DEV_OIDC_ISSUER: 'http://localhost:{{.KEYCLOAK_PORT_OUTER | default "8081"}}/realms/book-manager'

tasks:
  generate:
    desc: Generate code with go generate directives
    cmds:
      - go generate ./...

  docker-up:
    desc: Start Docker Compose services
    cmds:
      - docker compose -f docker/go-ddd-book-manager/docker-compose.yml up -d

  format:
    desc: Format codes with golines
    cmds:
      - go tool golines --base-formatter=gofmt -w .

  fix:
    desc: Fix codes
    cmds:
      - task: generate
      - task: format

  test:
    desc: Test the application
    deps:
      - generate
    cmds:
      - go test ./...

  run:
    desc: Run the application
    deps:
      - generate
      - docker-up
    env:
      DATABASE_URL: '{{.DATABASE_URL | default .DEV_DATABASE_URL}}'
      OIDC_ISSUER: '{{.OIDC_ISSUER | default .DEV_OIDC_ISSUER}}'
      OIDC_AUDIENCE: '{{.OIDC_AUDIENCE | default "book-manager-api"}}'
    cmds:
      - go run ./cmd

  build:
    desc: Build the production binary
    deps:
      - generate
    cmds:
      - mkdir -p bin
      - go build -trimpath -ldflags="-s -w" -o bin/app ./cmd

  migrate-up:
    desc: Apply SQL migrations
    env:
      DATABASE_URL: '{{.DATABASE_URL | default .DEV_DATABASE_URL}}'
    cmds:
      - go run ./cmd/migrate up

  migrate-down:
    desc: Roll back the last SQL migration group (requires DATABASE_URL)
    cmds:
      - go run ./cmd/migrate down

  migrate-create:
    desc: Create SQL migration files (task migrate-create -- name)
    cmds:
      - go run ./cmd/migrate create {{.CLI_ARGS}}

  test-integration:
    desc: Run PostgreSQL integration tests with Dockertest
    vars:
      docker_host:
        sh: docker context inspect | python3 -c 'import json, sys; print(json.load(sys.stdin)[0]["Endpoints"]["docker"]["Host"])'
    env:
      DOCKER_HOST: '{{.docker_host}}'
    cmds:
      - go test -tags=integration ./internal/infra/...
